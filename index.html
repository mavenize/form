<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ODIN – Sign Up</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="logo-band">
      <img src="images/odin-logo.png" alt="Odin logo">
      <h1>ODIN</h1>
    </div>
    <p class="credit">
      Photo by <a href="https://unsplash.com/@haliewestphoto">Halie West</a>
      on <a href="https://unsplash.com/photos/25xggax4bSA">Unsplash</a>
    </p>
  </aside>

  <main class="content">
    <section class="intro">
      <p>
        This is not a real online service! You know you need something like this
        in your life to help you realize your deepest dreams.
        Sign up <em>now</em> to get started.
      </p>
      <p>You <em>know</em> you want to.</p>
    </section>

    <form id="signup" class="form-card" action="#" method="post">
      <h2>Let's do this!</h2>
      <div class="fields">
        <div class="field">
          <label for="first-name">First Name</label>
          <input type="text" id="first-name" name="first_name" autocomplete="given-name" placeholder=" " required>
        </div>
        <div class="field">
          <label for="last-name">Last Name</label>
          <input type="text" id="last-name" name="last_name" autocomplete="family-name" placeholder=" " required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder=" " required>
        </div>
        <div class="field">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder=" ">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" placeholder=" " required>
        </div>
        <div class="field">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" name="confirm_password" autocomplete="new-password" minlength="8" placeholder=" " required>
        </div>
      </div>
    </form>

    <section class="actions">
      <button type="submit" form="signup">Create Account</button>
      <p>Already have an account? <a href="#">Log in</a></p>
    </section>
  </main>
</body>
</html>
